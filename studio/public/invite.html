<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Connect your accounts</title>
  <style>
    :root {
      --ground: #f4f6f7; --card: #ffffff; --ink: #14181c; --ink-2: #5b646d;
      --ink-3: #8b949c; --rule: #e0e5e9; --accent: #10714c; --accent-soft: #e6f2ec;
      --amber: #8a5a12; --amber-soft: #fbf1de;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #0f1215; --card: #171b1f; --ink: #e9edf0; --ink-2: #a3acb4;
        --ink-3: #78828a; --rule: #262c32; --accent: #4fbd8d; --accent-soft: #163026;
        --amber: #d9a441; --amber-soft: #2e2717;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--ground); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 600px; margin: 0 auto; padding: 44px 20px 80px; }
    .eyebrow {
      font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
      font-weight: 700; color: var(--ink-3); margin-bottom: 10px;
    }
    h1 { font-size: 28px; letter-spacing: -.02em; margin: 0 0 8px; text-wrap: balance; }
    .sub { color: var(--ink-2); margin: 0 0 28px; }
    .card {
      background: var(--card); border: 1px solid var(--rule);
      border-radius: 14px; padding: 20px 22px; margin-bottom: 14px;
    }
    .head { display: flex; align-items: center; gap: 11px; margin-bottom: 4px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
    .head b { font-size: 17px; }
    .head .state { margin-left: auto; font-size: 13px; color: var(--ink-3); }
    ul { margin: 12px 0 18px; padding-left: 19px; color: var(--ink-2); font-size: 14px; line-height: 1.6; }
    li { margin-bottom: 5px; }
    button {
      font: inherit; font-weight: 650; border-radius: 999px; padding: 12px 22px;
      cursor: pointer; border: 1px solid transparent; background: var(--accent); color: #fff;
      transition: filter .12s;
    }
    button:hover { filter: brightness(1.07); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    button.done { background: transparent; color: var(--accent); border-color: var(--accent); }
    .banner { border-radius: 12px; padding: 16px 18px; margin-bottom: 18px; font-size: 15px; }
    .banner.ok { background: var(--accent-soft); color: var(--accent); }
    .banner.bad { background: var(--amber-soft); color: var(--amber); }
    .banner b { display: block; margin-bottom: 3px; }
    .reassure {
      border-left: 3px solid var(--rule); padding-left: 15px;
      color: var(--ink-2); font-size: 14.5px; line-height: 1.6; margin: 26px 0 0;
    }
    .reassure b { color: var(--ink); }
    footer { text-align: center; color: var(--ink-3); font-size: 13px; margin-top: 30px; }
  </style>
</head>
<body>
  <div class="wrap" id="root">Loading…</div>

  <script>
    const token = location.pathname.split('/').pop();
    const root = document.getElementById('root');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function flash() {
      const q = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
      if (q.get('connected')) return `<div class="banner ok"><b>Connected</b>${esc(q.get('connected'))} is linked. Thank you.</div>`;
      if (q.get('error')) return `<div class="banner bad"><b>That didn't work</b>${esc(q.get('error'))}</div>`;
      return '';
    }

    async function load() {
      const res = await fetch(`/api/invite/${token}`);
      const data = await res.json();
      if (!res.ok) {
        root.innerHTML = `<h1>Link expired</h1><p class="sub">${esc(data.error)}</p>`;
        return;
      }
      draw(data);
    }

    function draw(invite) {
      root.innerHTML = `
        <div class="eyebrow">RET Media</div>
        <h1>Let us post for you</h1>
        <p class="sub">${invite.creator ? esc(invite.creator.name) + ' — o' : 'O'}ne tap per account.
          You stay the owner of everything and can switch this off whenever you like.</p>

        ${flash()}
        ${invite.note ? `<div class="card"><div style="color:var(--ink-2)">${esc(invite.note)}</div></div>` : ''}

        ${invite.platforms.map((p) => `
          <div class="card">
            <div class="head">
              <span class="dot" style="background:${esc(p.color)}"></span>
              <b>${esc(p.name)}</b>
              ${p.connected ? '<span class="state">Connected</span>' : ''}
            </div>
            ${p.connected
              ? `<div style="color:var(--ink-2);font-size:14px;margin:8px 0 16px">
                   ${esc(p.connected.displayName)} — nothing else needed.</div>
                 <button class="done" data-p="${esc(p.id)}">Connect a different account</button>`
              : `<button data-p="${esc(p.id)}">Connect ${esc(p.name)}</button>`}
          </div>`).join('')}

        <p class="reassure">
          <b>What this does.</b> It lets RET Media publish posts to your account. That is all it is —
          we cannot change your password, we cannot see your messages, and your role on the account
          does not change. <b>You stay the owner.</b>
          <br><br>
          <b>Turning it off.</b> Whenever you want, without asking us. For Google and YouTube it is
          at myaccount.google.com under Data &amp; privacy &rarr; Third-party apps. For the others it
          is in the app's own settings, under connected or authorised apps.
        </p>

        <footer>Sent by RET Media. If you weren't expecting this, just ignore it.</footer>`;

      root.querySelectorAll('[data-p]').forEach((el) => {
        el.onclick = async () => {
          el.disabled = true;
          el.textContent = 'Opening…';
          try {
            const res = await fetch(`/api/invite/${token}/connect/${el.dataset.p}`, { method: 'POST' });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);
            location.href = data.url;
          } catch (err) {
            el.disabled = false;
            el.textContent = 'Try again';
            root.scrollIntoView({ behavior: 'smooth' });
            const banner = document.createElement('div');
            banner.className = 'banner bad';
            banner.innerHTML = `<b>That didn't work</b>${esc(err.message)}`;
            root.prepend(banner);
          }
        };
      });
    }

    load();
  </script>
</body>
</html>
