<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ekko</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <aside>
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Ekko</span>
    </div>

    <div class="nav-item active" data-view="home">
      <span>Home</span>
    </div>
    <div class="nav-item" data-view="jobs">
      <span>Jobs</span>
      <span class="count" id="nav-job-count">0</span>
    </div>
    <div class="nav-item" data-view="settings">
      <span>Settings</span>
    </div>

    <div class="nav-group-label">Channels</div>
    <div class="channel-list" id="channel-list">
      <div class="empty">No channels yet</div>
    </div>
  </aside>

  <main id="main"></main>

  <div id="status-bar">
    <span class="pill idle" id="status-pill"><span class="dot"></span><span id="status-text">Idle</span></span>
    <span class="vault-path" id="vault-path"></span>
  </div>

  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script src="/app.js"></script>
</body>
</html>
