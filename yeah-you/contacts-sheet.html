<title>Yeah You Contacts Board</title>
<style>
  :root{
    --bg:#F3EEE6;--panel:#FBF8F2;--panel-2:#F0E9DD;--panel-3:#EAE1D2;
    --ink:#211C15;--ink-soft:#5A5044;--ink-faint:#8B8172;--line:#E0D6C6;--line-2:#D2C6B2;
    --accent:#D8442C;--accent-ink:#FFF;--amber:#C6852A;--ok:#2E8C74;--danger:#C23A2A;
    --shadow:0 1px 2px rgba(40,30,15,.06),0 6px 20px rgba(40,30,15,.07);
    --shadow-lift:0 4px 8px rgba(40,30,15,.10),0 16px 40px rgba(40,30,15,.14);
    --g-clients:#D8442C;--g-contact:#2E8C74;--g-email:#3A73B8;--g-agency:#C6852A;--g-research:#8A7FB0;
    --radius:14px;--radius-sm:9px;
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#17140F;--panel:#211D17;--panel-2:#2A251D;--panel-3:#332D23;
    --ink:#F1EADD;--ink-soft:#B7AC99;--ink-faint:#857A68;--line:#322C22;--line-2:#423A2C;
    --accent:#E8503A;--accent-ink:#1A1006;--amber:#E0A23C;--ok:#46B896;--danger:#EA6350;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.44);--shadow-lift:0 6px 14px rgba(0,0,0,.5),0 22px 50px rgba(0,0,0,.6);
    --g-clients:#E8503A;--g-contact:#46B896;--g-email:#5C97E0;--g-agency:#E0A23C;--g-research:#A99AD6;
  }}
  :root[data-theme="dark"]{
    --bg:#17140F;--panel:#211D17;--panel-2:#2A251D;--panel-3:#332D23;
    --ink:#F1EADD;--ink-soft:#B7AC99;--ink-faint:#857A68;--line:#322C22;--line-2:#423A2C;
    --accent:#E8503A;--accent-ink:#1A1006;--amber:#E0A23C;--ok:#46B896;--danger:#EA6350;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.44);--shadow-lift:0 6px 14px rgba(0,0,0,.5),0 22px 50px rgba(0,0,0,.6);
    --g-clients:#E8503A;--g-contact:#46B896;--g-email:#5C97E0;--g-agency:#E0A23C;--g-research:#A99AD6;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45;-webkit-font-smoothing:antialiased}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  .wrap{max-width:1560px;margin:0 auto;padding:0 clamp(14px,3vw,32px)}
  header{padding-top:20px}
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .oncircle{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent);flex:none}
  h1{font-size:clamp(1.3rem,2.4vw,1.85rem);letter-spacing:-.02em;margin:0;font-weight:800;line-height:1}
  .sub{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-top:5px}
  .head-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  button{font-family:var(--sans);cursor:pointer;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 13px;font-size:.84rem;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:transform .08s,background .15s,border-color .15s,color .15s}
  button:hover{border-color:var(--ink-faint)}
  button:active{transform:translateY(1px)}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  button.ghost{padding:9px 11px}
  .stats{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer}
  .stat.active{box-shadow:0 0 0 1px var(--stat-c) inset,var(--shadow)}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stat-c,var(--ink-faint))}
  .stat .n{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .stat .l{font-family:var(--mono);font-size:.57rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px}
  .toolbar{margin-top:15px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .search{flex:1 1 200px;min-width:160px;position:relative}
  .search input{width:100%;padding:9px 12px 9px 34px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-size:.88rem;font-family:var(--sans)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint)}
  .toolbar select{padding:9px 11px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-size:.82rem;font-family:var(--sans);max-width:170px}
  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--panel)}
  .seg button{border:none;border-radius:0;background:transparent;padding:9px 13px;font-size:.8rem;color:var(--ink-soft)}
  .seg button.on{background:var(--accent);color:var(--accent-ink)}
  .clearbtn{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--line-2));font-size:.8rem}
  .count-note{font-family:var(--mono);font-size:.7rem;color:var(--ink-faint);margin-left:auto;white-space:nowrap}
  .board-wrap{margin-top:16px;margin-bottom:60px}
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
  .col{flex:1 0 250px;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:110px;transition:border-color .15s,background .15s}
  .col.drag-over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  .col-head{padding:12px 13px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
  .dot{width:9px;height:9px;border-radius:3px;background:var(--col-c);flex:none}
  .col-head .t{font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:.72rem}
  .col-head .count{margin-left:auto;font-family:var(--mono);font-size:.72rem;font-weight:700;background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink-soft);border-radius:20px;min-width:22px;text-align:center;padding:1px 7px}
  .cards{padding:10px;display:flex;flex-direction:column;gap:9px;flex:1;max-height:66vh;overflow-y:auto}
  .card{background:var(--panel-2);border:1px solid var(--line-2);border-left:3px solid var(--col-c);border-radius:var(--radius-sm);padding:11px 12px;box-shadow:var(--shadow);cursor:grab;position:relative;transition:box-shadow .12s,transform .08s}
  .card:hover{box-shadow:var(--shadow-lift)}
  .card.dragging{opacity:.45;cursor:grabbing}
  .card .nm{font-weight:700;font-size:.95rem;letter-spacing:-.01em;line-height:1.2}
  .card .email{margin-top:6px;font-family:var(--mono);font-size:.76rem;color:var(--ok);word-break:break-all}
  .card .email a{color:inherit;text-decoration:none}
  .card .email a:hover{text-decoration:underline}
  .card .email.none{color:var(--ink-faint);font-style:italic;font-family:var(--sans)}
  .card .rep{font-size:.78rem;color:var(--ink-soft);margin-top:5px}
  .card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-family:var(--mono);font-size:.62rem;padding:2px 7px;border-radius:6px;background:var(--panel);border:1px solid var(--line-2);color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px;text-transform:uppercase;letter-spacing:.04em}
  .conf{font-weight:700}
  .conf.high{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line-2))}
  .conf.med{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,var(--line-2))}
  .conf.low{color:var(--ink-faint)}
  .conf.todo{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line-2))}
  .card .note{font-size:.75rem;color:var(--ink-soft);margin-top:7px;font-style:italic}
  .card-actions{display:flex;gap:5px;margin-top:9px;align-items:center}
  .iconbtn{font-size:.71rem;padding:4px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line-2);flex:none;line-height:1;text-decoration:none;color:var(--ink)}
  .iconbtn:hover{color:var(--accent);border-color:var(--accent)}
  .nav-wrap{margin-left:auto;display:flex;gap:4px}
  .col-empty{color:var(--ink-faint);font-size:.8rem;text-align:center;padding:16px 8px;font-style:italic}
  .add-in-col{margin:0 10px 10px;border:1px dashed var(--line-2);background:transparent;color:var(--ink-faint);justify-content:center;font-weight:600;font-size:.78rem}
  .add-in-col:hover{color:var(--accent);border-color:var(--accent)}
  /* table */
  .tablewrap{margin-top:16px;margin-bottom:60px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:.85rem}
  thead th{position:sticky;top:0;background:var(--panel);text-align:left;font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:11px 12px;border-bottom:1px solid var(--line-2);cursor:pointer;white-space:nowrap;z-index:2}
  thead th:hover{color:var(--ink)}
  tbody tr{border-bottom:1px solid var(--line)}
  tbody tr:hover{background:var(--panel-2)}
  td{padding:8px 12px;vertical-align:middle}
  td.nm{font-weight:700;white-space:nowrap;cursor:pointer}
  td .cat{font-family:var(--mono);font-size:.6rem;color:var(--ink-faint);text-transform:uppercase}
  td select.grp{padding:5px 8px;border-radius:7px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-size:.74rem;font-family:var(--sans)}
  td .gdot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px;vertical-align:middle}
  td input.emailedit{width:100%;min-width:160px;padding:5px 8px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ok);font-family:var(--mono);font-size:.78rem}
  td input.emailedit:hover{border-color:var(--line-2);background:var(--bg)}
  td input.emailedit:focus{border-color:var(--accent);background:var(--bg);color:var(--ink);outline:none}
  .tconf{font-family:var(--mono);font-size:.58rem;font-weight:700;padding:2px 6px;border-radius:5px;text-transform:uppercase}
  .tconf.high{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
  .tconf.med{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--amber)}
  .tconf.low{background:var(--panel-3);color:var(--ink-faint)}
  .tconf.todo{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
  td.tact{white-space:nowrap;text-align:right}
  .tempty{padding:30px;text-align:center;color:var(--ink-faint);font-style:italic}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,10,4,.5);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line-2);border-radius:18px;box-shadow:var(--shadow-lift);width:100%;max-width:520px;padding:22px}
  .modal h3{margin:0 0 3px;font-size:1.15rem;letter-spacing:-.01em}
  .modal .mh-sub{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:16px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:.66rem;font-family:var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-size:.9rem;font-family:var(--sans)}
  .field textarea{resize:vertical;min-height:54px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-actions{display:flex;gap:9px;margin-top:16px;align-items:center}
  .modal-actions .spacer{flex:1}
  .del-btn{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line-2))}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.85rem;font-weight:600;box-shadow:var(--shadow-lift);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:620px){.row2{grid-template-columns:1fr}.col{flex:0 0 82vw}.count-note{display:none}}
</style>

<div class="wrap">
<header>

    <span class="count-note" id="countNote"></span>
  </div>
</header>
<div class="board-wrap"><div class="board" id="board"></div></div>
<div class="tablewrap" id="tablewrap" style="display:none"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true">

  <form id="form">
    <div class="field"><label for="f-name">Name *</label><input id="f-name" required maxlength="80"></div>
    <div class="row2">
      <div class="field"><label for="f-cat">Category</label><input id="f-cat" list="catlist" maxlength="40"><datalist id="catlist"></datalist></div>
      <div class="field"><label for="f-group">Stage</label><select id="f-group"></select></div>
    </div>
    <div class="field"><label for="f-email">Email</label><input id="f-email" maxlength="120" placeholder="best email (leave blank if agency-only)"></div>
    <div class="row2">
      <div class="field"><label for="f-rep">Repped by / agency</label><input id="f-rep" maxlength="90"></div>
      <div class="field"><label for="f-conf">Confidence</label><select id="f-conf"><option value="high">High</option><option value="med">Medium</option><option value="low">Low</option><option value="todo">To research</option></select></div>
    </div>
    <div class="field"><label for="f-channel">Booking channel</label><input id="f-channel" maxlength="120" placeholder="e.g. Agency email / IG DM / bureau"></div>
    <div class="field"><label for="f-notes">Notes</label><textarea id="f-notes" maxlength="500"></textarea></div>
    <div class="modal-actions">
      <button type="button" class="del-btn" id="delBtn" hidden>Delete</button>
      <div class="spacer"></div>
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</div></div>
<div class="toast" id="toast"></div>

  function copy(t){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast("Copied "+t);},fb);else fb();function fb(){try{var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("Copied "+t);}catch(e){toast("Copy failed");}}}
  var toastEl=document.getElementById("toast"),tt;function toast(m){toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove("show");},1900);}

  applyTheme();applyView();refreshCats();render();
})();
</script>
